{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My groups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}?v=3">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <header class="top-nav">
            <h1>Manage groups</h1>
            <a href="{% url 'dashboard' %}" class="btn btn-outline">Home</a>
        </header>

        <div style="margin-bottom: 24px;">
            <a href="{% url 'group-add' %}" class="btn btn-primary">+ Add group</a>
        </div>

        <div class="card">
            <h2 class="card-header">Your groups</h2>
            <ul class="list-group">
                {% for group in groups %}
                    <li class="list-item">
                        <div>
                            <strong style="font-size: 1.1rem;">{{ group.name }}</strong>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                            <a href="{% url 'group-balance' pk=group.pk %}" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">
                                Group expenses
                            </a>
                            <a href="{% url 'add-member-to-group' pk=group.pk %}" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">
                                Add member
                            </a>
                        </div>
                    </li>
                {% empty %}
                    <li class="list-item text-muted" style="justify-content: center; padding: 32px 0;">
                        You don't belong to any group yet.
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
